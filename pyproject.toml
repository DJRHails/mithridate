[project]
name = "mithridate"
version = "0.1.0"
description = "Replication of 'When Bad Data Leads to Good Models' (Li et al., ICML 2025, arXiv:2505.04741)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "typer>=0.15",
    "loguru>=0.7",
    "pydantic>=2.9",
    "jaxtyping>=0.2.36",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a5",
]
lm = [
    "transformers>=5.8",  # qwen3_5 architecture (Qwen3.5/3.8) lands in 5.8
    "datasets>=3.2",
    "accelerate>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mithridate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "RET", "SIM"]
ignore = [
    "F722", # jaxtyping shape strings are not forward references
]
mccabe.max-complexity = 8

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# torch CPU wheels are sufficient for the toy experiment; the LM pipeline runs on the cluster.
